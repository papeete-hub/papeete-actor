[project]
name = "papeete-actor"
version = "0.1.0"
description = "Conformance gates for the Papeete ecosystem contracts — actor cards, inter-agent messages, publication logs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Papeete Consulting", email = "yoann.remy@outlook.com" }]
license = "MIT"
keywords = ["governance", "conformance", "agents", "bounded-context", "actor-model"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
papeete-actor = "papeete_actor.cli:main"

[build-system]
requires = ["hatchling", "pyyaml>=6.0"]
build-backend = "hatchling.build"

# The hook resolves contracts.pin before any build, so `pip install git+…` works from a bare
# checkout. Found the hard way: without it, a git-source install ships a gate with no contracts.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/papeete_actor"]
# The schemas are FETCHED, not committed (see contracts.pin) — so they are gitignored, and
# hatchling would exclude them from the wheel. `artifacts` is the override that says: these are
# build outputs and they belong in the distribution. A wheel without them is a gate with nothing
# to enforce, which `papeete-actor contracts` will tell you on the first run.
artifacts = ["src/papeete_actor/schemas/*.yaml"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/papeete_actor/schemas/*.yaml"]
