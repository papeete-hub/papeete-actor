[project]
name = "papeete-actor"
version = "0.1.0"
description = "A minimal, standalone actor identity contract for the Papeete ecosystem — papeete-actor-manifest/v0."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Papeete Consulting", email = "yoann.remy@outlook.com" }]
license = "MIT"
keywords = ["governance", "conformance", "agents", "actor-model", "manifest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
papeete-actor = "papeete_actor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: spawns a real Docker build (test_build.py) — needs a Docker daemon; deselect with -m 'not e2e' when none is available.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NO BUILD HOOK, NO FETCH, NO TOKEN. The schema under src/papeete_actor/schemas/ is ORDINARY
# COMMITTED SOURCE — this package IS the contract, not a gate that goes looking for it. It
# therefore ships in the wheel like any other package data, and a build needs no network and no
# credential.
[tool.hatch.build.targets.wheel]
packages = ["src/papeete_actor"]
