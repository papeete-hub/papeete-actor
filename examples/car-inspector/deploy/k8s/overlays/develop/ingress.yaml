apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-inspector
  annotations:
    # Strip the /ws-develop/car-inspector prefix before forwarding: the app itself
    # is rooted at / (routes like /health, /inspections) and knows nothing about it.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /ws-develop/car-inspector(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: car-inspector
                port:
                  number: 80
