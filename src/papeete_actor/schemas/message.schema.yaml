# message.schema.yaml — the inter-agent message contract.
#
# An inter-agent message is the transport-independent unit of communication between two bounded
# contexts (repos / human+agent pairs, ADR-ECO-0004): an ENVELOPE (what makes it a message + its
# identity) wrapping a PAYLOAD (today: a finding), delivered over a BINDING (today: a GitHub issue).
# A repo's own local issues carry no envelope and are, by definition, NOT messages.
# Doctrine: ../INTER-AGENT-MESSAGES.md. Decision: ADR-ECO-0008.
#
# OWNED BY ECO.GOV. Single source of truth behind two tools:
#   - lint_message.py    (the conformance gate — CI check on a binding; ECO.GOV owns it)
#   - render_message.py  (the deterministic renderer — authored in the settler work-pipeline
#                         template, which vendors this schema + the gate beside it)
# Both LOAD this file; neither hard-codes the fields, enums, or the projection. Change the contract
# here, once, and both the gate and the renderer follow. Consumers vendor a pinned copy.

contract: inter-agent-message/v0

# The one payload kind today (§1 of the doctrine). New kinds slot in without disturbing the
# envelope or the bindings.
kind: finding

# THE ENVELOPE — what makes an artifact a message, independent of transport. The discriminator is
# the litmus test: an artifact is an inter-agent message IFF it carries this envelope. Identity is
# (type, subject) — the dedup / idempotency key, and what "the message was already sent" means.
envelope:
  discriminator: 'finding: {type}:{subject}'
  identity: [type, subject]

# THE PAYLOAD — the finding itself. Transport-independent. A producer MAY add fields; it may not
# omit the required ones (the floor reliever-design#3 fell through: it dropped `severity` and left
# `scope` implicit).
payload:
  required: [type, rail, severity, scope, subject, description]
  optional:
    - evidence   # file/report the detector judged from
    - resolve    # suggested skill or tool
    - origin     # provenance of the route: "<repo>/<ledger> @ <ref>" — set by the renderer
  enums:
    rail: [functional-gap, contract-deviation, engineering-debt]
    severity: [high, medium, low]
  # `scope` is a capability node named EXPLICITLY (WORK-OBSERVABILITY §3 scoping rule), well-formed
  # at exactly one grain. Because ids encode the hierarchy as prefixes, this regex IS the grain
  # ladder: context BNK.RLVR | zone BNK.RLVR.CAP.BSP | L1 …BSP.001 | L2 …BSP.001.ENV
  scope_grammar: '^BNK\.[A-Z]+(\.CAP\.[A-Z0-9]+(\.[0-9]+(\.[A-Z0-9]+)?)?)?$'

# THE BINDINGS — how envelope+payload ride a concrete medium. GitHub issues are the first (and
# today only) binding. A future medium (a queue, a file drop, a direct channel) is a new entry
# here; the envelope and payload above do not change — that is the whole point of the separation.
bindings:
  github-issue:
    # The envelope rides as a hidden HTML comment, first line of the body. It is BOTH the message
    # discriminator (an issue is a message iff this is present) AND the idempotency key (search it
    # before creating, so a re-run upserts). The CI gate fires on THIS — never on issue labels,
    # which describe a message's rail, not whether it IS one.
    marker: 'finding: {type}:{subject}'
    # Carries `scope` into the title so the recipient knows which capability node it lands under
    # before reading a word (WORK-OBSERVABILITY §5 step 2).
    title: '{rail}: {scope} — {description}'
    # The rail becomes the issue label — the routing rail ADR-ECO-0004 Decision 4 fixed. It also
    # lets the gate catch an artifact that CLAIMS to be a message (carries a rail label) but dropped
    # its envelope — that must fail, not pass as "not a message".
    label_from: rail
    # The payload is embedded verbatim in a fenced block so triage is a copy and the gate can parse
    # it back. This language tag delimits it.
    body_block_lang: yaml
