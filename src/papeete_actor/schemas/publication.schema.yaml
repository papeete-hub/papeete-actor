# publication.schema.yaml — the publication contract.
#
# A PUBLICATION is a FACT a papeete-actor emits about its own state: addressed to nobody, refusable by
# nobody, ordered, append-only. Consumers subscribe by PULLING on their own cadence.
#
# THIS IS A SIBLING OF inter-agent-message/v0, NOT A BINDING OF IT. That contract carries a
# REQUEST: addressed to one papeete-actor, identity (type, subject), upsert semantics, refusable by its
# recipient at triage. A publication has none of those properties. Forcing the two into one
# contract would re-fuse the directions the direction rule separates (AGENT-OPERATING-MODEL §5:
# addressed upstream, published downstream). See ADR-ECO-0011.
#
# OWNED BY ECO.GOV. Doctrine: ../AGENT-OPERATING-MODEL.md §5 (the transactional outbox),
# ../cards/README.md (subscriptions are declared consumer-side).
# Decisions: ADR-ECO-0011 (the contract), ADR-ECO-0013 (v1), ADR-ECO-0016 (this revision).
#
# ─── v1 → v2 ──────────────────────────────────────────────────────────────────────────────────
# Two additions, both from one observation: A PUBLICATION HAS THREE KINDS OF CONSUMER, and v1
# served only one of them (ADR-ECO-0016).
#   1. `payload` — every publication now declares a per-publication payload SCHEMA, and it is
#      REQUIRED. v1 schematised the record ENVELOPE and nothing else, leaving a scripted consumer
#      with prose to validate against.
#   2. `bindings.human-view` — a rendered projection for a human-operated papeete-actor, generated from
#      the schema, never hand-authored.
# Nothing in v1 is retired. The record envelope, the pinning rule, the ref rule, atomicity, git
# ordering, backfill, and the whole `consumption` block are unchanged.
#
# GRANDFATHERING, as v1 grandfathered v0: a `shape` describes records written from v2 ONWARD.
# Existing records are NOT retrofitted. This log is append-only, and editing history to satisfy a
# contract written after it would break the one property consumers rely on.
# ──────────────────────────────────────────────────────────────────────────────────────────────
#
# ─── v0 → v1 ──────────────────────────────────────────────────────────────────────────────────
# Three changes, each replacing an enumeration with the property that generates it (ADR-ECO-0013):
#   1. `breaking_required_for: [vendored-artifact]` is RETIRED. The obligation follows from
#      PINNING, not from vendoring — see `the_pinning_rule` below.
#   2. `backfilled` added to the optional fields. A late record must be machine-detectable,
#      because it is the one case where git order and truth order disagree.
#   3. A binding may be INTERIOR, declared through a level-1 descriptor. See `bindings.interior`.
# Records written under v0 REMAIN VALID AS WRITTEN. This log is append-only: nobody goes back to
# add `backfilled:` to an existing record. The field applies to records written from here on.
# ──────────────────────────────────────────────────────────────────────────────────────────────

contract: publication/v2

kind: publication

# THE RECORD — one fact. Immutable once committed: append-only means files are ADDED, never
# edited. A correction is a new publication that supersedes, never an edit of the old one.
record:
  required:
    - publication   # the publication id, as declared in the producer's papeete-actor card
    - at            # ISO-8601 date the FACT became true
    - ref           # the pin a consumer would adopt to consume it — see `ref_rule`
    - summary       # one line, human-readable
  optional:
    - scope         # capability node, when the fact is about one (WORK-OBSERVABILITY §3 grammar)
    - subject       # the precise artifact id, when narrower than scope
    - breaking      # true | false — see `the_pinning_rule`
    - evidence      # path/report backing the fact
    - supersedes    # `<publication>/<ref>` this CORRECTS — not "is late", see `backfilled`
    - backfilled    # ISO-8601 date this RECORD was written, when later than `at`

# THE PAYLOAD — the per-publication schema. NEW IN v2.
#
# The block above schematises the ENVELOPE, and it is identical for every publication in the
# ecosystem. It says nothing about what a `meta-model` record carries that an `ApplicationStubbed`
# record does not. A scripted consumer therefore had nothing to validate against, and v1 left it
# reading prose — which it cannot parse.
#
#   THREE KINDS OF CONSUMER READ A PUBLICATION, AND ONLY ONE OF THEM CAN READ PROSE.
#
#     an agent papeete-actor   — reads the schema AND the card's `means` prose, and judges
#     a human papeete-actor    — reads a rendering (see bindings.human-view); `agent: none` describes
#                        three papeete-actors today: banking-tech, banking-governance, ECO.GOV
#     a scripted papeete-actor — parses fields, fails closed, and must pin
#
# THE SCHEMA IS THE FLOOR, THE PROSE IS THE CEILING, AND THE HUMAN VIEW IS A RENDERING OF THE
# FLOOR. The prose is additive, never substitutive.
#
# WHY UNCONDITIONAL, rather than "required when a consumer scripts against it": a producer CANNOT
# SEE ITS CONSUMERS. `consumption.no_consumer_list` forbids it from knowing, and subscriptions are
# declared consumer-side. A producer asked to decide when a schema is owed would be guessing about
# information the contract deliberately denies it — the same trap ADR-ECO-0013 escaped by
# replacing `breaking_required_for: [vendored-artifact]` with the pinning rule. Here the property
# that generates the obligation is simply: the fact was published at all.
payload:
  required: true
  declared_in: papeete-actor-card/v1 publications[].shape
  location: events/{publication}/schema.yaml    # producer-owned, in the PRODUCER's repo

  # `schema.yaml` IS A RESERVED FILENAME, NOT A RECORD. It lives inside the log directory so a
  # publication's shape sits beside its facts, but a tool walking events/*/*.yaml must exclude it
  # — otherwise it reads as a record whose `ref` is "schema", and fails validation.
  # Discovered by writing the first one; stated here rather than left for each gate to rediscover.
  # `ref` is a version identifier or a sha (the ref rule), so "schema" can never be a real ref.
  reserved_filename: true

  # ECO.GOV owns THIS contract. It does not own anyone's payload — a payload schema is domain
  # knowledge, and the tier that emits the fact is the only one that can author it.
  owned_by: the producing papeete-actor

  applies_to: records written from v2 onward   # see the grandfathering note in the header

  # THE OBLIGATION BINDS AT EMISSION, NOT AT DECLARATION.
  #
  # Discovered by dogfooding this rule on ECO.GOV's own card, which declares seven publications and
  # has ever emitted records for ONE. A schema for a publication that has never produced a record
  # cannot be verified against anything — it would be authored from imagination and read as settled
  # fact, which is exactly how `card-governance.md` came to advertise a publication that did not
  # exist (cards/README.md, "verify, never transcribe").
  #
  # So: `shape: none` is LEGAL for a publication with an empty log, and MUST carry a `status:`
  # saying so. The first record written closes it — a producer cannot emit a fact and leave its
  # shape undeclared.
  #
  # THIS IS NOT THE "required only when someone scripts against it" RULE THAT WAS REJECTED. That one
  # asked a producer to guess at its consumers, which `no_consumer_list` forbids it from knowing.
  # This binds on a fact about the producer's OWN log, which it can always see.
  binds_at: first record
  unemitted_publication: 'shape: none, with a status stating the log is empty'

# THE PINNING RULE — what generates the breaking obligation.
#
#   A publication whose consumers PIN it MUST carry `breaking: true` when it breaks.
#
# Pinning is precisely what makes a consumer unable to see the change for itself. Vendoring is one
# way to pin, not the distinguishing feature — which is what the retired `breaking_required_for:
# [vendored-artifact]` got wrong. Every mechanism is covered: byte-vendored copies, tag/sha pins
# pulled through kpack, image tags, git refs, sibling-path reads.
#
# A pin-and-pull consumer is STRICTLY WORSE OFF than a vendoring one: a vendoring consumer at
# least byte-diffs its copy and sees the change; a pin-and-pull consumer diffs nothing and can
# only observe that its pin moved. Worked instance (issue #14): two breaking changes shipped from
# reliever-business under PATCH tags, and reliever-design's detector could only report
# `STALE_PROVENANCE / severity: medium / resolve: /process` — a routine re-pin nudge standing in
# for a breaking-change notice, because that is all it could know.
the_pinning_rule:
  applies_when: consumers pin this publication by any mechanism
  requires: breaking is declared explicitly on every record, true or false
  # The author declares the judgement; no gate can infer it. A gate can only force it to be made
  # — which is what reliever-business/tools/check_publication_outbox.py does.

# THE REF RULE — discovered by emitting the first live record against this contract.
#
# `ref` is what a consumer would pin. It CANNOT be the announcing commit's own sha: the record
# lands in the same commit as the change (see `atomicity`), and a commit cannot contain its own
# hash. So for a live record `ref` is a version identifier or a tag that will point at this
# commit. Only a BACKFILL can carry a sha, because for a backfill the commit is already history.
ref_rule:
  live_record: a version identifier or tag (e.g. `publication/v1`, `v1.0.0`)
  backfilled_record: a version identifier, tag, or the historical commit sha it describes
  never: the sha of the commit carrying this record

# THE BINDINGS — how the record rides a medium.
bindings:
  event-log:
    # In the PRODUCER's repo. Never in a consumer's: a publisher writes only to its own state.
    path: events/
    # One file per fact, grouped by publication id. One file per (publication, ref) — PLUS the
    # reserved `schema.yaml` (v2, see `payload`), which is the publication's shape and not a fact.
    # One-file-per-fact rather than one appended log file: concurrent appends never conflict,
    # and each fact has a reviewable diff of its own.
    layout: 'events/{publication}/{ref}.yaml'

    # THE ONE HARD RULE. The event file is committed in the SAME COMMIT as the change it
    # describes — that is what makes this a transactional outbox rather than a dual write.
    # An events/ entry landing in its own later commit is non-conformant: between the two
    # commits the repo asserts a state its log denies.
    atomicity: same-commit-as-the-change

    # Order is NOT encoded in the record — git IS the transaction log.
    #   what happened since my pin:  git log <pinned_ref>..HEAD -- events/
    #   ...for one subscription:     git log <pinned_ref>..HEAD -- events/{publication}/
    # No sequence numbers to allocate, no ordering field to get wrong, no conflicts.
    ordering: git-commit-order

    # A BACKFILL BREAKS THE ORDERING INVARIANT, which is why it must be declared in a field and
    # not in prose. Its commit position and its `at` date disagree, so a consumer walking git
    # order silently misplaces it. `backfilled:` is how that consumer detects the case
    # mechanically; `summary` cannot be read by a tool. `supersedes` is NOT the field for this —
    # it means "corrects a prior record", and a late record corrects nothing.
    #
    # A backfill is a breach of `atomicity`, honestly disclosed. It is preferable to the
    # alternatives: rewriting a tag to hide a process failure invalidates consumer pins, and
    # silence loses the fact entirely.
    backfill: declared via `backfilled`, never repaired in place

  # THE HUMAN VIEW (ADR-ECO-0016). NEW IN v2.
  #
  # A human-operated papeete-actor cannot be handed a YAML record, and three papeete-actors are human-operated
  # today (`agent: none`: banking-tech, banking-governance, ECO.GOV). The human view is a
  # PROJECTION OF THE SCHEMA — the same structure inter-agent-message/v0 already uses, where
  # `bindings.github-issue` carries `title:` and `body_block_lang:` and render_message.py
  # generates the issue.
  #
  # RENDERED, NEVER HAND-AUTHORED — the rule INTER-AGENT-MESSAGES already states, and the reason
  # `payload` above must exist: YOU CANNOT DETERMINISTICALLY RENDER FROM PROSE. A hand-written
  # human view is a second source of truth that drifts from the log it claims to show.
  human-view:
    rendered_from: shape
    title: '{publication}: {scope} — {summary}'
    # Where the rendering lands is the CONSUMER's choice — its BOARD.md, an issue in its own repo,
    # a digest. It is NOT a delivery: rendering happens on the consumer's side, on the consumer's
    # cadence. A producer rendering into a consumer's repo would breach `no_delivery` (below).
    surface: consumer's own — BOARD.md | an issue | a digest
    renderer: none yet — extract from render_message.py rather than writing afresh

  # INTERIOR BINDINGS (ADR-ECO-0013 §3). A publication's binding is sometimes machinery a card is
  # not allowed to name — banking-tech's authoring method is bound to a set of framework skills,
  # and ADR-ECO-0012 forbids a card from naming a framework or framework directory.
  #
  # A papeete-actor MAY therefore give a publication's `surface` as a POINTER to a level-1 descriptor it
  # owns (settler/extract_map.yaml, banking-knowledge/exports.yaml) rather than a path list.
  # Two requirements keep this honest rather than a loophole:
  interior:
    must_name_the_descriptor: true    # "declare the fact, delegate the binding" is sanctioned;
                                      # "declare the fact, hide the binding" is not — the join
                                      # must be able to follow the pointer, or the edge is
                                      # invisible (undeclared consumption, ADR-ECO-0014 §5)
    descriptor_may_churn: true        # the whole point of the indirection: a card listing paths
                                      # would change on every refactor, making the external
                                      # contract a function of internal layout

# THE CONSUMER SIDE — stated here because the producer must NOT implement it.
consumption:
  mode: pull
  # A consumer declares what it pulls in its own papeete-actor card (`subscriptions`, actor-card/v0).
  # The producer declares only what it publishes. Fan-out is the JOIN of the two across cards
  # — subscription as data, never publisher knowledge of consumers (ADR-ECO-0004 Decision 4).
  declared_in: actor-card/v0 subscriptions
  # Explicitly NOT part of this contract, at any autonomy level:
  no_delivery: true         # the producer never notifies, dispatches, or opens an issue anywhere
  no_acknowledgement: true  # a publication is a fact; nobody accepts or refuses it
  no_consumer_list: true    # the producer does not know, and must not record, who consumes it

# STILL NOT CLOSED (ADR-ECO-0013 consequences): widening the producer's obligation does not tell a
# consumer that a breaking record exists. Consumers poll on their own cadence, and no consumer
# currently declares one.
#
# STILL NOT CLOSED (ADR-ECO-0016): the two faces break differently, and only one of them is
# governed. A `shape` change breaks a scripted consumer silently, which is exactly what `breaking`
# exists to announce. A `means` change breaks no script at all — and may change what an agent
# consumer DECIDES, because that prose is what it judges against. Nothing here records a meaning
# revision, and it is not obvious that `breaking` is the right instrument for one. Revisit when an
# papeete-actor first rewrites a `means` under a live `intent:` subscription.
