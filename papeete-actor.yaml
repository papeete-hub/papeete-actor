# papeete-actor.yaml — this repo's own card (papeete-actor-card/v1).
#
# THE RECURSION IS DELIBERATE. This repo ships the contract this file conforms to, and the gate
# that checks it. CI runs `papeete-actor lint-card papeete-actor.yaml` on every push: if the
# schemas failed to ship in the wheel, or the gate could not read them, this check fails. It is the
# cheapest end-to-end proof the package works, and it is also the honest position — a repo that
# publishes an actorhood contract and does not itself hold a card would be exempting the author
# from the rule (ADR-PA-0009 §6, applied to itself).
#
# Contract: src/papeete_actor/schemas/papeete-actor-card.schema.yaml — in this repo (ADR-PA-0001).

card: papeete-actor-card/v1
papeete_actor: none                  # no ECO.* / BNK.* context id — the same position banking-tech
                                     # and reliever-implementation hold. Registered by repo path.
tier: none                           # not one of the five — this is ecosystem-layer equipment
name: none                           # human-operated; no agent
repo: papeete-hub/papeete-actor
strategic_class: published-policy    # the contracts are published policy every actor pins
pair:
  human: [architect]
  agent: none

mailbox:
  contract: inter-agent-message/v0
  binding: github-issue
  address: papeete-hub/papeete-actor/issues
  delivery: at-least-once
  idempotency: [type, subject]
  push: false
  status: >-
    NEWLY ADDRESSABLE, and it closes a hole ECO.GOV's own card names. "No rail carries 'your
    contract is unsatisfiable in my repo' back to the contract author" was true while the contracts
    sat in a read-only supervisor with no inbound rail. They now sit in a repo with a mailbox.

# ── offers: what I can be asked to do ───────────────────────────────────
offers:
  - id: contract-deviation
    means: >-
      the door for "your contract cannot express something my repo really does". Addressed to
      whoever holds a card, or is trying to write one, and finds the shape unsatisfiable — a
      required field that has no honest value, a true thing with no slot, a rule that mandates a
      bug in their case. NOT the door for a gate that crashes or misreports (that is engineering
      debt, and it is mine to fix without being asked), nor for a contract that is merely
      inconvenient to satisfy.
    nature: action
    rail: contract-deviation
    completion: >-
      a revision of the schema, published as a new contract version — or a refusal saying why the
      shape is right and the reported case is out of scope.
    from: any actor whose card cannot express something its repo really does
    ground_truth: >-
      the case that motivated actor-card/v1 — five adopted v0 cards each invented an ad-hoc field
      (`authority`, `caveat`, `outbox`) because the contract enumerated nothing. Those were
      deviations nobody had a door for; this is the door.
    note: >-
      A CONTRACT THAT CANNOT BE CONTRADICTED IS THE FAILURE ECO.GOV WROTE DOWN ABOUT ITSELF. This
      offer exists so the author of a shape can be told the shape is wrong, by the pair that hit it.

# ── releases: the versioned artefacts I ship ────────────────────────────
# ONE, and it is the whole point of the repo: the package. Cutting it IS emitting `gates` — the
# artefact is the state a consumer resolves, the publication is the statement that it exists.
releases:
  - id: papeete-actor
    means: >-
      the conformance gates for all four contracts, plus the contracts themselves, as one
      pip-installable package. Resolve it if you hold a papeete-actor card, or are writing one, and
      want the shape checked rather than reviewed by eye. It needs no credential to anything: the
      schemas are in the wheel, so a build reaches nothing outside its own checkout (ADR-PA-0001).
    versioning: semver
    surface: PyPI `papeete-actor`; source at papeete-hub/papeete-actor
    announced_by: gates
    shape: none
    status: >-
      0.1.0 released 2026-07-23 via Trusted Publishing; 0.4.0 prepared and not yet tagged. The TOOL
      version and the CONTRACT versions move independently — `papeete-actor contracts` prints which
      a given build enforces (ADR-PA-0012 §6), so a major bump here is about the gates, never about
      the shapes.
      THE VERSION IN pyproject.toml IS NOT A RELEASE. It moved 0.1.0 -> 0.4.0 across three
      untagged commits, and only a tag reaches PyPI — so `papeete-actor>=0.1.0` in a consumer
      resolves to 0.1.0 to this day, and every contract change since is invisible to everyone who
      installed rather than cloned. Bumping the number is not the act; cutting the tag is.

# ── publications: facts I emit ──────────────────────────────────────────
# These three moved here from ECO.GOV with the schemas themselves (ADR-PA-0001 / ADR-ECO-0019).
# A revision to any of them is consumed by every actor in the ecosystem, by reference — and
# reference is a pin, so every one of them carries a breaking_flag obligation.
publications:
  - id: papeete-actor-card-contract
    means: >-
      papeete-actor-card/v1 — the five sections a card carries (offers, releases, publications,
      subscriptions, dependencies) and the rules that keep each one's owner straight: a producer
      supplies meaning, a consumer declares intent, and behaviour is proposed, never contracted.
      Downstream and consumer-side are two kinds crossed with two directions — state in
      releases/dependencies, occurrence in publications/subscriptions. Every repo that is a
      papeete-actor declares this contract's version in its own card, so a revision here moves a
      shape the whole ecosystem is pinned to.
    shape: events/papeete-actor-card-contract/schema.yaml
    status: >-
      EMITTING. One record — `0.4.0`, `breaking: true`: required `releases`, required
      `offers[].means`, and the `rail` enum moved to the deployment profile. The debt this line
      used to describe is paid; what paid it was a CONSUMER, not a resolution. papeete-actor-simple
      discovered `offers[].means` had become required by its own test suite going red — which is
      precisely the failure the breaking_flag exists to prevent, and did not.
    surface: src/papeete_actor/schemas/papeete-actor-card.schema.yaml
    breaking_flag: >-
      REQUIRED — every card in the ecosystem declares this contract's version, which is a pin by
      reference.
  - id: message-contract
    means: >-
      inter-agent-message/v0 — the envelope that makes an artifact a message, the finding payload it
      wraps, and the bindings it rides. An artifact is a message iff it carries the envelope.
    shape: events/message-contract/schema.yaml
    status: >-
      EMITTING. One record — `0.4.0`, `breaking: false`: the `rail` enum and the `scope` grammar
      moved to a deployment profile. A WIDENING, so v0 did not become v1 — no message that
      validated before stops validating, and one that could not be written at all outside this
      domain now can.
    surface: src/papeete_actor/schemas/message.schema.yaml
  - id: publication-contract
    means: >-
      publication/v2 — the transactional outbox, the request/publication binding split, the pinning
      rule, the per-publication payload schema and the human-view projection.
    shape: none
    status: >-
      no record emitted HERE, and NONE OWED — publication/v2 is byte-identical to what shipped in
      0.1.0. v1 and v2 were announced from ECO.GOV's log, which is where the records for them live;
      this publication inherits the id, not the history. `shape: none` stays legal while the log is
      empty; the obligation binds at first record, and the first record has not happened.
    surface: src/papeete_actor/schemas/publication.schema.yaml
    breaking_flag: >-
      REQUIRED — consumed by reference, and at least three actors have built gates encoding this
      contract's shape.
  - id: registry-contract
    means: >-
      ecosystem-registry/v0 — the shape of the index that makes distributed cards discoverable:
      which repos an ecosystem knows, which of them carry cards, and where each card sits. It
      describes the INDEX and stops there; how a deployment models its own orgs, edges and
      topology is that deployment's, and a rule about it here would breach this repo's
      hard_boundary. Concerns whoever authors a registry, and whoever reads externality out of
      one — which is every consumer of papeete-actor-card/v1, since that contract derives
      externality from `card_status`.
    shape: events/registry-contract/schema.yaml
    status: >-
      EMITTING. One record — `0.5.0`, `breaking: false`: a NEW contract, so nothing that
      conformed stops conforming. It closes a hole two published contracts already depended on:
      the card contract names registry.yaml "the sole authority for WHERE a card lives" and
      derives externality from `card_status`, while the shape of that file existed only as a
      dict comprehension in this package's source (ADR-PA-0017).
    surface: src/papeete_actor/schemas/registry.schema.yaml
    breaking_flag: >-
      REQUIRED — an ecosystem has exactly one registry and every card in it is found through
      that file, so a change to its shape reaches every actor at once.
  - id: gates
    means: >-
      the conformance gates for all four contracts plus the cross-card join, as one installable
      package. A consumer pins a version instead of vendoring a schema and byte-diffing it, and
      needs no credential to anything: the contracts are in the wheel.
    shape: events/gates/schema.yaml
    status: >-
      EMITTING, two records. `0.1.0` — on PyPI 2026-07-23 via Trusted Publishing with no stored
      credential, BACKFILLED because nothing announced it at the time. `0.4.0`, `breaking: true` —
      the card contract moves, the deployment profile arrives, `check` refuses the retired `actor:`
      key. 0.2.0 and 0.3.0 exist in pyproject.toml history and were never tagged, so no consumer
      could ever resolve them and none is owed a record.
      TWO CONSUMERS NOW, and they are not the same kind. ECO.GOV pins the CLI. papeete-actor-simple
      pins the LIBRARY — it imports `papeete_actor.cards.lint` and merges the Report into its own,
      because the card contract is consumed there and never re-authored (ADR-PAS-0004).
    surface: pyproject.toml; src/papeete_actor/ (PyPI name `papeete-actor`)
    breaking_flag: >-
      REQUIRED once released — consumers pin `papeete-actor==`, which is a pin by any reading of
      the pinning rule.

# ── subscriptions: what I pull, and what I do about it ──────────────────
subscriptions:
  - to: ECO.GOV/ecosystem-registry
    notice:
      binding: by-reference          # the registry is read, never copied
      position: none                 # read at HEAD — the join is over the ecosystem as it stands
      use: cross-card-join
      cadence: on demand
    then:
      run: src/papeete_actor/check.py
      outcome: records
      note: >-
        `papeete-actor check` walks the registry to find every card, then joins publications against
        subscriptions and dependencies. It reads the registry; it never writes to it. `position:
        none` is the reference-binding exemption in `the_pin_rule` — a join pinned to yesterday's
        registry would report yesterday's ecosystem.

# ── dependencies: whose contract I resolve, and at what ref ─────────────
# ONE, AND IT IS NOT THE CONTRACTS. Before ADR-PA-0001 this repo resolved ECO.GOV's contracts at a
# pinned commit and could not build without read access to a private lab repo. It now depends on
# ECO.GOV for exactly one thing — the registry, and only to locate cards for the cross-card join.
# Nothing in a BUILD or an INSTALL touches it, which is what makes this package standalone.
dependencies:
  - id: ECO.GOV
    ref: main                        # reference binding, read at HEAD — see the_pin_rule

records:
  - what: the four ecosystem contracts — the store of record, mine alone to write
    where: src/papeete_actor/schemas/
  - what: >-
      the reference deployment profile — one deployment's rails and taxonomy grammar, shipped as a
      reference and never as a privilege (ADR-PA-0016)
    where: src/papeete_actor/profiles/
  - what: the publication log — the facts I have emitted, append-only
    where: events/
  - what: the gates and the cross-card join
    where: src/papeete_actor/
  - what: this repo's decision log
    where: adr/ (ADR-PA-*), incl. eleven records moved from ECO.GOV by ADR-PA-0014
  - what: the doctrine — how to design a papeete-actor, not only validate one
    where: doc/ (operating model, messages, work-observability, the card doctrine + template)

gates:
  - papeete-actor lint-card — one card against papeete-actor-card/v1, including this repo's own
  - papeete-actor check — the cross-card join over every card in the registry
  - papeete-actor lint-publication — this repo's own events/ log against publication/v2
  - papeete-actor lint-registry — the index that makes every other card findable
  - >-
    the gate suite — the contracts' own rules, asserted against built cards rather than against
    this repo's card, which is written to pass and therefore proves almost nothing
  - ci.yml — the wheel must carry its contracts, and must lint this card with them

hard_boundary: >-
  the contracts and their gates, nothing else. This repo does not own the ecosystem's map, its
  operating model or its topology — those stay with ECO.GOV, and a decision about them recorded
  here would be the altitude violation ADR-ECO-0007 names.
work_surface: none                   # no work.yaml yet — not conformant with work-observability/v0
autonomy: level-0                    # every write through a human-reviewed PR

open:
  - >-
    AN ACTOR THAT SHIPS AN ARTEFACT MUST EMIT PUBLICATIONS, and nobody chose that. `releases[]` is
    required to carry `announced_by`, which must name a publication on the same card — so
    `publications: []` and a non-empty `releases` cannot both hold. Any deployment that restricts
    itself to addressed messages therefore cannot ship a release at all. papeete-actor-simple is
    the worked proof: its restriction forbids publications, and its own card had to leave the
    restriction to declare its own package. This is MY shape and MY defect; it is reported on the
    consumer's card as the strongest `contract-deviation` candidate it holds, and the door for it
    is the offer above. Undecided: widen `announced_by` to accept a release-only actor, or rule
    that shipping an artefact IS emitting a fact and the restriction is what must give.
  - >-
    THE LIBRARY SURFACE IS CONTRACTED BY USE AND DECLARED NOWHERE. `releases[].means` describes a
    pip-installable package of gates; it does not say that `papeete_actor.cards.lint` and
    `papeete_actor.report.Report` are entry points another package builds on. papeete-actor-simple
    does exactly that, and defends itself by calling positionally with one argument because it
    cannot know which keyword arguments a given build offers. It is right to: the signature gained
    `prof` at 0.4.0. The suite now pins that surface, but a card that advertises a CLI while a
    consumer pins a Python API is a membrane describing the wrong thing.
  - >-
    This repo publishes an actorhood contract and is not conformant with work-observability/v0 —
    no work.yaml, no detection ledger, no kanban. The same nonconformity ECO.GOV records about
    itself, inherited with the contracts.
  - >-
    `papeete_actor: none`. Should ecosystem-layer equipment carry an `ECO.*` id, or is a repo path
    the right identity for something that is not one of the five tiers? ADR-PA-0009 §1 ruled the
    actorhood test is about repo/pair/state/address, not about holding an id — so this is
    conformant, and still reads like a gap.
  - >-
    Does the template that scaffolds a new papeete-actor ship here as `papeete-actor new`?
    Sovereignty makes it possible; nothing yet makes it right, and the five facets that would
    parameterise such a template are undecided (ADR-PA-0013 §4).
