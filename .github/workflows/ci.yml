name: ci
on: [push, pull_request]

# NO CREDENTIAL. This pipeline reaches nothing outside its own checkout — the contract is
# committed source here, not something fetched from a private sibling.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: the gate suite
        # FIRST, because everything below it asserts that the package ARRIVED, and nothing below
        # it asserts that the package is RIGHT.
        run: uv run --extra dev pytest -q

      - name: build
        run: uv build
      - name: the wheel must carry its contract
        # A wheel that installs cleanly and enforces nothing is the failure mode worth a gate.
        run: |
          uv venv /tmp/probe
          uv pip install --python /tmp/probe/bin/python -q dist/*.whl
          /tmp/probe/bin/papeete-actor contracts
      - name: the gate must run
        # The package validates its own manifest with its own contract — the smallest end-to-end
        # proof that the schema shipped and the gate can read it.
        run: /tmp/probe/bin/papeete-actor lint-manifest actor.yaml
