name: release
on:
  push:
    tags: ["v*"]

# PyPI Trusted Publishing (OIDC) — no token is stored anywhere. The one-time setup is a pending
# publisher on pypi.org naming this repo and this workflow; after the first release it becomes a
# normal publisher. See README.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: build
        # No fetch step and no CONTRACTS_READ_TOKEN: the contracts are committed here
        # (ADR-PA-0001). A release now depends on nothing but this checkout and PyPI.
        run: uv build
      - name: verify the wheel carries its contracts
        run: |
          uv venv /tmp/probe
          uv pip install --python /tmp/probe/bin/python -q dist/*.whl
          /tmp/probe/bin/papeete-actor contracts
      - name: publish to PyPI
        run: uv publish --trusted-publishing always
