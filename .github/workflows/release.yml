name: release
on:
  push:
    tags: ["v*"]

# PyPI Trusted Publishing (OIDC) — no token is stored anywhere. The one-time setup is a pending
# publisher on pypi.org naming this repo and this workflow; after the first release it becomes a
# normal publisher. See README.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: resolve contracts.pin
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRACTS_READ_TOKEN }}
        run: uv run --with pyyaml python3 scripts/fetch_contracts.py
      - name: build
        run: uv build
      - name: verify the wheel carries its contracts
        run: |
          uv venv /tmp/probe
          /tmp/probe/bin/python -m pip install -q dist/*.whl
          /tmp/probe/bin/papeete-actor contracts
      - name: publish to PyPI
        run: uv publish --trusted-publishing always
