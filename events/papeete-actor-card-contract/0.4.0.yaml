publication: papeete-actor-card-contract
at: 2026-07-24
ref: 0.4.0
breaking: true
summary: >-
  papeete-actor-card/v1 gains a REQUIRED `releases` section and a REQUIRED `offers[].means`; the
  `rail` enum leaves the contract for the deployment profile. A card that conformed at 0.1.0 with
  offers, or with no `releases:` key, no longer conforms.
evidence: >-
  ADR-PA-0010 (offers[].means — the deferred asymmetry, and the evidence that forced it: three
  cards, one door, `nature: query` never used), ADR-PA-0016 (the deployment profile), commits
  5b66eb0 and 6974a20 and cb765fa. The delta a consumer must act on, in full:

    offers[].means      ADDED, required.  A door nobody can tell apart from another door is not
                        an advertisement. Every offer on every card must now say what it is for.
    releases            ADDED, required as a key — `[]` is legal and complete, "a terminal tier
                        owes the ecosystem findings, not artefacts" (ADR-PA-0009 §3). A card with
                        no `releases:` key at all now fails.
    releases[]          when non-empty: id, means, versioning, surface, announced_by — and
                        `announced_by` must name a publication on the SAME card, checked by
                        lint-card as `conformance.unannounced_release`.
    offers[].rail       the ENUM moved out of the contract into the deployment profile. Under the
                        shipped reference profile the three Papeete rails are unchanged, so no
                        Papeete card is affected; a deployment supplying its own profile now
                        supplies its own rails. The FIELD is still required.
