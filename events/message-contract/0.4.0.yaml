publication: message-contract
at: 2026-07-24
ref: 0.4.0
breaking: false
summary: >-
  inter-agent-message/v0 stops hard-coding one deployment's values: the `rail` enum and the
  `scope` grammar move to a deployment profile. The contract stays v0 — every message that
  validated before still validates, under the shipped reference profile.
evidence: >-
  ADR-PA-0016, commit cb765fa. `breaking: false` is a judgement, so here is the ground for it:

    payload.enums.rail    REMOVED from the contract, RE-DECLARED under `payload.profiled`. The
                          shipped profile `profiles/papeete.yaml` carries the same three rails
                          (functional-gap, contract-deviation, engineering-debt), so a Papeete
                          message sees no change at all.
    payload.scope         was validated against a `^BNK\.` regex hard-coded in messages.py — not
                          in the contract, which never said what an id looks like. It is now
                          `scope_grammar` in the profile, defaulting to that same regex.
    payload.required      UNCHANGED. `rail` and `scope` are still required. A profile may
                          under-constrain their VALUES; it can never drop the fields.

  THE CHANGE IS A WIDENING, and the case that motivated it is the one nobody could satisfy: an
  organisation outside this ecosystem could not emit a conformant message AT ALL, because `scope`
  was required and no value without the literal `BNK.` prefix matched. A governance contract that
  cannot be satisfied outside the domain it grew in is an internal one, which is what ADR-PA-0001
  refused to ship. Nothing that conformed stopped conforming, so v0 did not become v1.
