# events/message-contract/schema.yaml — the payload shape for this publication.
#
# PRODUCER-OWNED, and it constrains publication/v2's envelope rather than replacing it. See the
# sibling schema under events/papeete-actor-card-contract/ for why these files exist at all.

kind: message-contract
record: publication/v2

required: [publication, at, ref, summary, breaking]

notes:
  ref: >-
    the `papeete-actor` version a consumer pins to hold this contract shape — the package version,
    not the contract version. `inter-agent-message/v0` has not left v0.
  breaking: >-
    DECLARED HERE THOUGH THE CARD OBLIGES IT ONLY FOR `papeete-actor-card-contract` AND `gates`.
    This publication carries no breaking_flag because the message contract is consumed by repos
    that vendor a renderer rather than pin a shape — but a consumer still has to know, and a field
    that is cheap to declare and expensive to want later is declared.
  summary: >-
    what moved in the envelope, the payload or the bindings. A consumer reads it to decide whether
    its renderer and its gate still agree with the contract.
  widening: >-
    NOT A FIELD — a note about how to judge `breaking` here. A change that makes MORE artifacts
    conformant breaks nobody: no message that validated before stops validating. That is the
    correct reading of the profile change below, and it is why v0 did not become v1.
